sentence=Type K thermocouple library for MAX6675 and MAX31855 modules: temperature up to 1350 C, cold junction, open and short detection, clear messages. No dependencies.
paragraph=Reads a type K thermocouple through a MAX6675 (0 to 1024 C) or MAX31855 (-200 to 1350 C) SPI module with one object: AlashThermocouple tc(AlashThermocouple::MAX6675, cs, clk, miso); tc.temperature(). Software SPI on any pins or hardware SPI, internal cold junction temperature of the MAX31855, detection of a broken thermocouple and of a short to GND or VCC, frame plausibility check, caching to the chip conversion time, offset. Explains wiring problems in Russian, Kazakh or English. Needs only the built-in SPI library. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
category=Sensors
